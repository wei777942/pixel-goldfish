<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14102a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%272%27 y=%276%27 width=%2710%27 height=%274%27 fill=%27%23ff9a2e%27/%3E%3Crect x=%270%27 y=%275%27 width=%273%27 height=%276%27 fill=%27%23ffd23f%27/%3E%3C/svg%3E">
<title>撈金魚 · 手機控制器</title>
<style>
@font-face{font-family:Fusion;src:url(fonts/fusion-subset.woff2) format('woff2');font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#14102a;color:#fff4d6;font-family:Fusion,monospace;font-size:16px;overflow:hidden;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));gap:8px;--pc:#ff4f8b}
.box{border:3px solid #3c4166;background:#0b0a1e;box-shadow:0 0 0 2px #14102a}
#top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px}
#pname{font-size:22px;color:var(--pc)}
.dot{display:inline-block;width:10px;height:10px;background:#6b7399;margin-right:5px;vertical-align:middle}
.dot.on{background:#b6f23a}.dot.warn{background:#ffd23f}.dot.off{background:#e8423c}
#conn{font-size:13px;line-height:1.3;text-align:right}
#mid{display:flex;align-items:stretch;gap:8px}
#score{flex:1;text-align:center;padding:4px 0}
#score b{display:block;font-size:56px;line-height:1;color:#fff;text-shadow:3px 3px 0 #8b1d2c;font-weight:normal}
#score small{color:#9aa3c7;font-size:13px}
#timer{width:96px;text-align:center;padding:8px 0;font-size:30px;color:#ffd23f}
#timer small{display:block;color:#9aa3c7;font-size:12px}
#dur{padding:6px 8px}
#bar{height:18px;background:#14102a;border:3px solid #3c4166;margin-top:4px}
#barfill{height:100%;width:100%;background:#b6f23a;transition:width .15s}
#netstate{font-size:13px;color:#9aa3c7;display:flex;justify-content:space-between}
#pad{flex:1;position:relative;border:3px dashed #3c4166;background:repeating-linear-gradient(0deg,#0b0a1e 0 14px,#0f0d28 14px 28px);display:flex;align-items:center;justify-content:center;text-align:center;color:#6b7399;touch-action:none;min-height:80px}
#pad.act{border-color:var(--pc)}
#padhint{pointer-events:none;line-height:1.6}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:50%;top:40%;font-size:44px;color:#ffd23f;text-shadow:3px 3px 0 #14102a;animation:up 1.1s ease-out forwards}
.pop.x{color:#e8423c}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-90px);opacity:0}}
#btn{height:26vh;min-height:110px;max-height:210px;border:4px solid #14102a;background:var(--pc);color:#14102a;font-family:inherit;font-size:26px;line-height:1.3;box-shadow:0 8px 0 #8b1d2c;touch-action:none;padding:0}
#btn.down{transform:translateY(6px);box-shadow:0 2px 0 #8b1d2c;filter:brightness(1.15)}
#btn:disabled{background:#3c4166;box-shadow:0 8px 0 #1c1c38;color:#9aa3c7}
#ready{display:none;height:26vh;min-height:110px;max-height:210px;border:4px solid #14102a;background:#ffd23f;color:#14102a;font-family:inherit;font-size:34px;box-shadow:0 8px 0 #ff9f1c;touch-action:manipulation}
#ready:active{transform:translateY(6px);box-shadow:0 2px 0 #ff9f1c}
#ready:disabled{background:#b6f23a;box-shadow:0 8px 0 #4c8a00}
#app.offline #pad,#app.offline #btn,#app.offline #dur,#app.offline #mid{opacity:.35}
#msg{text-align:center;color:#9aa3c7;font-size:14px;min-height:20px}
#over{position:fixed;left:0;right:0;top:0;height:70%;background:#14102a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;z-index:5}
#over h1{font-size:48px;margin:0;color:#ffd23f;text-shadow:4px 4px 0 #8b1d2c;font-weight:normal}
#over p{margin:0;font-size:20px}
#join{position:fixed;inset:0;background:#14102a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;padding:20px}
#join input{font-family:inherit;font-size:30px;width:100%;max-width:300px;text-align:center;text-transform:uppercase;padding:10px;background:#0b0a1e;color:#ffd23f;border:3px solid #3c4166}
#join button{font-family:inherit;font-size:26px;padding:12px 24px;background:#ffd23f;border:4px solid #14102a;box-shadow:0 6px 0 #ff9f1c}
</style>
</head>
<body>
<div id="app">
  <div id="top" class="box"><span id="pname">連線中…</span><span id="conn"></span></div>
  <div id="mid">
    <div id="score" class="box"><small>分數</small><b id="sc">0</b></div>
    <div id="timer" class="box"><small>剩餘</small><span id="tm">--</span></div>
  </div>
  <div id="dur" class="box"><div id="netstate"><span>紙網耐久</span><span id="nstxt">100%</span></div><div id="bar"><div id="barfill"></div></div></div>
  <div id="pad"><div id="padhint">在這裡滑動<br>移動紙網</div><div id="pops"></div></div>
  <button id="btn" disabled>按住 = 下水<br>放開 = 撈!</button>
  <button id="ready">READY</button>
  <div id="msg"></div>
</div>
<div id="over"><h1 id="overh"></h1><p id="overp"></p></div>
<div id="join"><div style="font-size:30px;color:#ffd23f">撈金魚</div><div>輸入大螢幕上的房間碼</div><input id="roomin" maxlength="10" autocomplete="off" autocapitalize="characters"><button id="gobtn">加入</button></div>
<script src="vendor/noble-secp256k1.min.js"></script>
<script src="relay.js"></script>
<script src="play.js"></script>
</body>
</html>
